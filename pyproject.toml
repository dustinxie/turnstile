[project]
name = "turnstile"
version = "0.1.0"
description = "Chatbot service on a one-loop, two-layer agent kernel (L0/L1/L2)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "cryptography>=46.0.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    # SAML SSO: the xmlsec/lxml manylinux wheels are ABI-COUPLED —
    # mismatched pairs segfault. Bump only as a tested pair.
    "lxml==6.0.2",
    "mcp>=2.0.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python3-saml==1.16.0",
    "sse-starlette>=3.4.8",
    "uvicorn>=0.52.3",
    "xmlsec==1.3.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile"]

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

# Whole-program type gate (same engine as Pylance, enforced in CI). Convention:
# modules use `from __future__ import annotations`, so forward references need
# no quoting. Tagged-union `match` arms prove exhaustiveness via assert_never.
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# The dependency rule (docs/architecture.md §1) as a failing build. `root` is
# deliberately in NO forbidden list — composition is its job, that's its
# documented exemption.
# TODO(second driver): if a sibling driver lands (e.g. `turnstile.cli` next to
# `turnstile.service`), add an "independence" contract over the drivers — they
# consume root.assemble(), never each other.
[tool.importlinter]
root_package = "turnstile"

[[tool.importlinter.contracts]]
name = "Layers: products -> capabilities -> kernel"
type = "layers"
layers = ["turnstile.products", "turnstile.capabilities", "turnstile.kernel"]

[[tool.importlinter.contracts]]
name = "L0 kernel imports nothing internal"
type = "forbidden"
source_modules = ["turnstile.kernel"]
forbidden_modules = [
    "turnstile.capabilities",
    "turnstile.products",
    "turnstile.service",
    "turnstile.root",
    "turnstile.config",
]

[[tool.importlinter.contracts]]
name = "L1 capabilities import kernel only"
type = "forbidden"
source_modules = ["turnstile.capabilities"]
forbidden_modules = [
    "turnstile.products",
    "turnstile.service",
    "turnstile.root",
    # design doc §4: config never crosses into a capability — root converts
    # at the boundary (plain kwargs / a mirror type).
    "turnstile.config",
]

[[tool.importlinter.contracts]]
name = "L2 products never import service/root/config"
type = "forbidden"
source_modules = ["turnstile.products"]
forbidden_modules = [
    "turnstile.service",
    "turnstile.root",
    # specs read cfg DUCK-TYPED (design doc §3) — naming the class here would
    # make every product depend on the deployment's config layer.
    "turnstile.config",
]

[[tool.importlinter.contracts]]
name = "Service is driver-generic: root + kernel only"
type = "forbidden"
source_modules = ["turnstile.service"]
forbidden_modules = [
    "turnstile.products",
    "turnstile.capabilities",
    # the driver reads deployment config through root.assemble()'s bundle,
    # never directly.
    "turnstile.config",
]
# DIRECT imports only: service -> root -> products is the intended path (the
# bundle); the ban is on the service NAMING product/capability/config types.
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Product specs are siblings: no spec imports another"
type = "independence"
modules = ["turnstile.products.specs.*"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
extend-select = [
    "I",    # isort — deterministic import order
    "B",    # bugbear — likely bugs
    "UP",   # pyupgrade — modern 3.12 idioms
    "SLF",  # flake8-self — no reaching into another object's _private members
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001"]  # tests may peek at internals to reach states deterministically

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: kernel + products on testkit doubles; fast, zero I/O",
    "service: in-process ASGI tests incl. SSE framing",
    "integration: real Postgres / real provider endpoint; pre-merge or nightly",
]
