[project]
name = "turnstile"
version = "0.1.0"
description = "Chatbot service on a one-loop, two-layer agent kernel (L0/L1/L2)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: kernel + products on testkit doubles; fast, zero I/O",
    "service: in-process ASGI tests incl. SSE framing",
    "integration: real Postgres / real provider endpoint; pre-merge or nightly",
]
