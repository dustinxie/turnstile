# COMPROMISE — remove with the commit that adds it, once the previous
# assistant is retired. Lets both apps share ONE FAC SP registration
# (ACS /sso/acs) on the same host.

# ── http {} level: which backend answers the ACS POST ──
map $cookie_turnstile_login $sso_upstream {
    default  http://api.chatbot.docker:5000/api/v1;   # previous assistant, as today
    "1"      http://api.hrassist.docker:8000;         # a login that started at /v1/sso
}

# ── server {} level ──
location /sso {
    set $backend "$sso_upstream$request_uri";
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-FortiSSO-Uri $uri;
}

location /v1/sso {
    # normalize a trailing slash here: the app must never answer "/sso/" with
    # a 307 to "/sso" (that path belongs to the previous assistant)
    rewrite ^/v1/sso/?$ /sso break;
    rewrite ^/v1(/sso/.+)$ $1 break;
    proxy_pass http://api.hrassist.docker:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-FortiSSO-Uri $uri;
}
